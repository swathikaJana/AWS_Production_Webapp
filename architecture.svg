<rect x="998" y="500" width="190" height="20" fill="#eef5e6"/><text x="1004" y="514">0.0.0.0/0</text><text x="1101" y="514">nat-b-id</text>
<rect x="998" y="520" width="190" height="20" fill="#fff" stroke="#eef5e6"/><text x="1004" y="534">10.0.0.0/16</text><text x="1101" y="534">local</text>
