<rect x="998" y="230" width="190" height="20" fill="#eef5e6"/><text x="1004" y="244">0.0.0.0/0</text><text x="1101" y="244">igw-id</text>
<rect x="998" y="250" width="190" height="20" fill="#fff" stroke="#eef5e6"/><text x="1004" y="264">10.0.0.0/16</text><text x="1101" y="264">local</text>
