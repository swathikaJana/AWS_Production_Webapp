<text x="324" y="289">NAT Gateway A</text><text x="876" y="289">NAT Gateway B</text>
<text x="632" y="123" text-anchor="start">Internet Gateway</text>
<text x="424" y="604">EC2 + Apache</text><text x="424" y="618" fill="#555">SG: port 80 from ALB</text>
<text x="776" y="604">EC2 + Apache</text><text x="776" y="618" fill="#555">SG: port 80 from ALB</text>
<text x="636" y="804" text-anchor="start">Amazon S3 static website (accessed directly by users)</text>
</g>

